<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" width="210mm" height="297mm" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Horisontalsnitt gjennom leveggen som viser fire kledningsprinsipper: tett på én side, spaltet, vekselvis og tett på begge sider">
  <title>Levegg – kledningsprinsipp, horisontalsnitt</title>
  <desc>Horisontalsnitt sett ovenfra gjennom leveggen. Tegningen viser fire alternative utførelser av stående kledning.</desc>

  <defs>
    <marker id="pilRod" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b03a2e"/>
    </marker>
    <marker id="pilGron" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e7d32"/>
    </marker>
    <!-- Dobbelfals med kort synlig fuge og sammenhengende underfals under nabobordet. -->
    <path id="bordMedDobbelfals" d="M0,0 H30 V6 H37 V13 H4 V6 H0 Z"/>
  </defs>

  <rect width="900" height="980" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Kledningsprinsipp – horisontalsnitt gjennom leveggen</text>

  <!-- ============ 1 – SPALTET ============ -->
  <text x="710" y="146" text-anchor="middle" font-size="10.5" fill="#b03a2e">Et hus får stygg side</text>
  <text x="710" y="160" text-anchor="middle" font-size="10.5" fill="#b03a2e">med reisverk mot seg.</text>
  <text x="40" y="176" font-size="15" font-weight="600" fill="#1a1a1a">1 – Spaltet</text>
  <text x="40" y="196" font-size="12" fill="#555">23 × 48 mm bord,</text>
  <text x="40" y="216" font-size="12" fill="#555">10 mm gjennomgående spalte</text>
  <text x="40" y="236" font-size="12" fill="#555">≈ 17 % åpning</text>

  <line x1="260" y1="180" x2="820" y2="180" stroke="#8a7f6a" stroke-width="14"/>
  <g fill="#9e9c94" stroke="#6e6b64" stroke-width="1">
    <rect x="260" y="187" width="27" height="13"/><rect x="293" y="187" width="27" height="13"/>
    <rect x="326" y="187" width="27" height="13"/><rect x="359" y="187" width="27" height="13"/>
    <rect x="392" y="187" width="27" height="13"/><rect x="425" y="187" width="27" height="13"/>
    <rect x="458" y="187" width="27" height="13"/><rect x="491" y="187" width="27" height="13"/>
    <rect x="524" y="187" width="27" height="13"/><rect x="557" y="187" width="27" height="13"/>
    <rect x="590" y="187" width="27" height="13"/><rect x="623" y="187" width="27" height="13"/>
    <rect x="656" y="187" width="27" height="13"/><rect x="689" y="187" width="27" height="13"/>
    <rect x="722" y="187" width="27" height="13"/><rect x="755" y="187" width="27" height="13"/>
    <rect x="788" y="187" width="27" height="13"/>
  </g>
  <line x1="290" y1="240" x2="290" y2="124" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#pilRod)"/>
  <text x="298" y="234" font-size="11" fill="#b03a2e">Fri sikt gjennom spalten</text>
  <line x1="500" y1="240" x2="500" y2="124" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#pilGron)"/>
  <text x="508" y="234" font-size="11" fill="#2e7d32">Luft passerer rett gjennom</text>

  <!-- ============ 2 – VEKSELVIS ============ -->
  <text x="40" y="396" font-size="15" font-weight="600" fill="#1a1a1a">2 – Vekselvis på begge sider</text>
  <text x="40" y="416" font-size="12" fill="#555">23 × 48 mm bord med 10 mm</text>
  <text x="40" y="438" font-size="12" fill="#555">spalte. Andre side forskjøvet</text>
  <text x="40" y="458" font-size="12" fill="#555">29 mm (halv borddeling).</text>

  <line x1="260" y1="400" x2="820" y2="400" stroke="#8a7f6a" stroke-width="14"/>
  <!-- Bord på nordsiden -->
  <g fill="#b3b0a8" stroke="#6e6b64" stroke-width="1">
    <rect x="276.5" y="380" width="27" height="13"/><rect x="309.5" y="380" width="27" height="13"/>
    <rect x="342.5" y="380" width="27" height="13"/><rect x="375.5" y="380" width="27" height="13"/>
    <rect x="408.5" y="380" width="27" height="13"/><rect x="441.5" y="380" width="27" height="13"/>
    <rect x="474.5" y="380" width="27" height="13"/><rect x="507.5" y="380" width="27" height="13"/>
    <rect x="540.5" y="380" width="27" height="13"/><rect x="573.5" y="380" width="27" height="13"/>
    <rect x="606.5" y="380" width="27" height="13"/><rect x="639.5" y="380" width="27" height="13"/>
    <rect x="672.5" y="380" width="27" height="13"/><rect x="705.5" y="380" width="27" height="13"/>
    <rect x="738.5" y="380" width="27" height="13"/><rect x="771.5" y="380" width="27" height="13"/>
  </g>
  <!-- Bord på sørsiden -->
  <g fill="#9e9c94" stroke="#6e6b64" stroke-width="1">
    <rect x="260" y="407" width="27" height="13"/><rect x="293" y="407" width="27" height="13"/>
    <rect x="326" y="407" width="27" height="13"/><rect x="359" y="407" width="27" height="13"/>
    <rect x="392" y="407" width="27" height="13"/><rect x="425" y="407" width="27" height="13"/>
    <rect x="458" y="407" width="27" height="13"/><rect x="491" y="407" width="27" height="13"/>
    <rect x="524" y="407" width="27" height="13"/><rect x="557" y="407" width="27" height="13"/>
    <rect x="590" y="407" width="27" height="13"/><rect x="623" y="407" width="27" height="13"/>
    <rect x="656" y="407" width="27" height="13"/><rect x="689" y="407" width="27" height="13"/>
    <rect x="722" y="407" width="27" height="13"/><rect x="755" y="407" width="27" height="13"/>
    <rect x="788" y="407" width="27" height="13"/>
  </g>
  <line x1="300" y1="470" x2="300" y2="436" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#pilGron)"/>
  <text x="308" y="464" font-size="11" fill="#2e7d32">Siktlinje blokkert av bordet bak</text>
  <path d="M500,470 L500,435 L485,420 L485,400 L500,385 L500,352" fill="none" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#pilGron)"/>
  <text x="512" y="350" font-size="11" fill="#2e7d32">Luft passerer i sikksakk</text>

  <!-- ============ 3 – HELT TETT PÅ ÉN SIDE ============ -->
  <text x="710" y="586" text-anchor="middle" font-size="10.5" fill="#b03a2e">Et hus får stygg side</text>
  <text x="710" y="600" text-anchor="middle" font-size="10.5" fill="#b03a2e">med reisverk mot seg.</text>
  <text x="40" y="616" font-size="15" font-weight="600" fill="#1a1a1a">3 – Helt tett på én side</text>
  <text x="40" y="636" font-size="12" fill="#555">Dobbelfals med rette kanter,</text>
  <text x="40" y="656" font-size="12" fill="#555">vekslende overlapp og ca. 5 mm</text>
  <text x="40" y="676" font-size="12" fill="#555">spalte. Fals under nabobord.</text>

  <line x1="260" y1="620" x2="820" y2="620" stroke="#8a7f6a" stroke-width="14"/>
  <g fill="#9e9c94" stroke="#6e6b64" stroke-width="1" transform="translate(0 1267) scale(1 -1)">
    <use href="#bordMedDobbelfals" x="260" y="627"/><use href="#bordMedDobbelfals" x="293" y="627"/>
    <use href="#bordMedDobbelfals" x="326" y="627"/><use href="#bordMedDobbelfals" x="359" y="627"/>
    <use href="#bordMedDobbelfals" x="392" y="627"/><use href="#bordMedDobbelfals" x="425" y="627"/>
    <use href="#bordMedDobbelfals" x="458" y="627"/><use href="#bordMedDobbelfals" x="491" y="627"/>
    <use href="#bordMedDobbelfals" x="524" y="627"/><use href="#bordMedDobbelfals" x="557" y="627"/>
    <use href="#bordMedDobbelfals" x="590" y="627"/><use href="#bordMedDobbelfals" x="623" y="627"/>
    <use href="#bordMedDobbelfals" x="656" y="627"/><use href="#bordMedDobbelfals" x="689" y="627"/>
    <use href="#bordMedDobbelfals" x="722" y="627"/><use href="#bordMedDobbelfals" x="755" y="627"/>
    <use href="#bordMedDobbelfals" x="788" y="627"/>
  </g>
  <line x1="300" y1="680" x2="300" y2="644" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#pilGron)"/>
  <text x="308" y="674" font-size="11" fill="#2e7d32">Siktlinje blokkert</text>
  <line x1="500" y1="680" x2="500" y2="644" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="5 3"/>
  <circle cx="500" cy="640" r="6" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
  <line x1="496" y1="636" x2="504" y2="644" stroke="#b03a2e" stroke-width="1.6"/>
  <text x="512" y="674" font-size="11" fill="#b03a2e">Ingen luftgjennomgang</text>

  <!-- ============ 4 – TETT PÅ BEGGE SIDER ============ -->
  <text x="40" y="836" font-size="15" font-weight="600" fill="#1a1a1a">4 – Helt tett på begge sider</text>
  <text x="40" y="856" font-size="12" fill="#555">Dobbelfals med rette kanter,</text>
  <text x="40" y="876" font-size="12" fill="#555">dybde 1/2 bordtykkelse</text>
  <text x="40" y="896" font-size="12" fill="#555">vekslende overlapp og ca. 5 mm</text>
  <text x="40" y="916" font-size="12" fill="#555">spalte. Fals under nabobord.</text>

  <line x1="260" y1="840" x2="820" y2="840" stroke="#8a7f6a" stroke-width="14"/>
  <!-- Bord på nordsiden -->
  <g fill="#b3b0a8" stroke="#6e6b64" stroke-width="1">
    <use href="#bordMedDobbelfals" x="260" y="820"/><use href="#bordMedDobbelfals" x="293" y="820"/>
    <use href="#bordMedDobbelfals" x="326" y="820"/><use href="#bordMedDobbelfals" x="359" y="820"/>
    <use href="#bordMedDobbelfals" x="392" y="820"/><use href="#bordMedDobbelfals" x="425" y="820"/>
    <use href="#bordMedDobbelfals" x="458" y="820"/><use href="#bordMedDobbelfals" x="491" y="820"/>
    <use href="#bordMedDobbelfals" x="524" y="820"/><use href="#bordMedDobbelfals" x="557" y="820"/>
    <use href="#bordMedDobbelfals" x="590" y="820"/><use href="#bordMedDobbelfals" x="623" y="820"/>
    <use href="#bordMedDobbelfals" x="656" y="820"/><use href="#bordMedDobbelfals" x="689" y="820"/>
    <use href="#bordMedDobbelfals" x="722" y="820"/><use href="#bordMedDobbelfals" x="755" y="820"/>
    <use href="#bordMedDobbelfals" x="788" y="820"/>
  </g>
  <!-- Bord på sørsiden -->
  <g fill="#9e9c94" stroke="#6e6b64" stroke-width="1">
    <use href="#bordMedDobbelfals" transform="translate(260 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(293 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(326 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(359 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(392 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(425 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(458 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(491 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(524 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(557 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(590 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(623 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(656 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(689 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(722 860) scale(1 -1)"/><use href="#bordMedDobbelfals" transform="translate(755 860) scale(1 -1)"/>
    <use href="#bordMedDobbelfals" transform="translate(788 860) scale(1 -1)"/>
  </g>
  <line x1="300" y1="920" x2="300" y2="864" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#pilGron)"/>
  <text x="308" y="914" font-size="11" fill="#2e7d32">Siktlinje blokkert</text>
  <line x1="500" y1="920" x2="500" y2="864" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="5 3"/>
  <circle cx="500" cy="860" r="6" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
  <line x1="496" y1="856" x2="504" y2="864" stroke="#b03a2e" stroke-width="1.6"/>
  <text x="512" y="914" font-size="11" fill="#b03a2e">Ingen luftgjennomgang</text>

</svg>
