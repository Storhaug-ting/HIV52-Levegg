<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1400" width="820" height="1400" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Planskisse alternativ 1 med forskjovne hus og maalte lengder for de fire leveggene">
  <title>Levegger rekka HIV 50–58 – planskisse alternativ 1</title>
  <desc>Plan med nord opp. Husene ligger forskjøvet: HIV 50 står 3,8 m lenger vest enn HIV 52 og 54, som igjen står 1,8 m lenger vest enn HIV 56 og 58. Rekka er dreid ca. 2° i forhold til nord. Hver levegg føres til foten av skråningen, begrenset til 5,0 m.</desc>

  <defs>
    <pattern id="skraaning" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9aa89a" stroke-width="2"/>
    </pattern>
    <pattern id="platting" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e4ddce"/>
      <line x1="0" y1="0.5" x2="8" y2="0.5" stroke="#c7bda6" stroke-width="1"/>
    </pattern>
    <marker id="pil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="820" height="1400" fill="#ffffff"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Alternativ 1 – levegg til foten av skråningen, maks 5,0 m</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#555">Plan, rekka Helge Ingstads vei 50–58 (hus B, seksjon 6–10), Griniskogen Vest. Nord opp.</text>
  <text x="410" y="72" text-anchor="middle" font-size="12.5" fill="#555">Rekka er dreid ca. 2° i forhold til nord. Skala 1 m = 24 px.</text>

  <!-- Nordpil -->
  <g stroke="#444" fill="#444">
    <line x1="770" y1="180" x2="770" y2="118" stroke-width="2" marker-end="url(#pil)"/>
    <text x="770" y="204" text-anchor="middle" font-size="14" font-weight="600" stroke="none">N</text>
  </g>

  <g transform="rotate(2 372 623)">

  <!-- Uteoppholdsareal -->
  <path d="M309,140 L469,140 L498,333 L527,526 L541,719 L563,912 L585,1107 L443,1107 L443,719 L400,719 L400,333 L309,333 Z"
        fill="#f2f7ee" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Plattinger, 4,15 m langs veggen x 3,0 m ut, i sørenden av hver bolig -->
  <g fill="url(#platting)" stroke="#a89e88" stroke-width="1.2">
    <rect x="309" y="233" width="72" height="100"/>
    <rect x="400" y="426" width="72" height="100"/>
    <rect x="400" y="619" width="72" height="100"/>
    <rect x="443" y="812" width="72" height="100"/>
    <rect x="443" y="1007" width="72" height="100"/>
  </g>
  <text x="436" y="480" text-anchor="middle" font-size="10.5" fill="#6b6250">Platting</text>
  <text x="436" y="494" text-anchor="middle" font-size="10.5" fill="#6b6250">4,15 × 3,0 m</text>

  <!-- Skråning -->
  <path d="M469,140 L498,333 L527,526 L541,719 L563,912 L585,1107 L660,1107 L660,140 Z" fill="url(#skraaning)" stroke="#8b9a8b" stroke-width="1"/>
  <polyline points="498,333 527,526 541,719 563,912" fill="none" stroke="#5c6b5c" stroke-width="3"/>
  <polyline points="469,140 498,333" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="563,912 585,1107" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#5c6b5c">
    <circle cx="498" cy="333" r="4"/><circle cx="527" cy="526" r="4"/><circle cx="541" cy="719" r="4"/><circle cx="563" cy="912" r="4"/>
  </g>
  <text x="696" y="620" font-size="13" fill="#3f4a3f" transform="rotate(90 696 620)" text-anchor="middle">Skråning / haug</text>

  <!-- Husrekka med forskyvning -->
  <g fill="#e8e2d6" stroke="#8a7f6a" stroke-width="2">
    <rect x="85" y="140" width="224" height="193"/>
    <rect x="176" y="333" width="224" height="193"/>
    <rect x="176" y="526" width="224" height="193"/>
    <rect x="219" y="719" width="224" height="193"/>
    <rect x="219" y="912" width="224" height="195"/>
  </g>
  <g text-anchor="middle" fill="#4a4232">
    <text x="197" y="230" font-size="16">HIV 50</text><text x="197" y="250" font-size="11" fill="#6b6250">seksjon 6</text>
    <text x="288" y="423" font-size="16" font-weight="600" fill="#1a1a1a">HIV 52</text><text x="288" y="443" font-size="11" fill="#6b6250">seksjon 7</text>
    <text x="288" y="616" font-size="16">HIV 54</text><text x="288" y="636" font-size="11" fill="#6b6250">seksjon 8</text>
    <text x="331" y="809" font-size="16">HIV 56</text><text x="331" y="829" font-size="11" fill="#8a5a2b">seksjon 9 – usolgt</text>
    <text x="331" y="1004" font-size="16">HIV 58</text><text x="331" y="1024" font-size="11" fill="#6b6250">seksjon 10</text>
  </g>
  <text x="68" y="620" font-size="11" fill="#6b6250" transform="rotate(-90 68 620)" text-anchor="middle">Vestside – adkomst og carport</text>

  <!-- Levegger -->
  <g stroke="#7a4a1e" stroke-width="9" stroke-linecap="square">
    <line x1="400" y1="333" x2="498" y2="333"/>
    <line x1="400" y1="526" x2="520" y2="526"/>
    <line x1="443" y1="719" x2="541" y2="719"/>
    <line x1="443" y1="912" x2="563" y2="912"/>
  </g>

  <!-- Stolper c/c maks 0,80 m -->
  <g fill="#5c3714">
    <circle cx="400" cy="333" r="3"/><circle cx="416" cy="333" r="3"/><circle cx="433" cy="333" r="3"/><circle cx="449" cy="333" r="3"/><circle cx="465" cy="333" r="3"/><circle cx="482" cy="333" r="3"/><circle cx="498" cy="333" r="3"/>
    <circle cx="400" cy="526" r="3"/><circle cx="417" cy="526" r="3"/><circle cx="434" cy="526" r="3"/><circle cx="451" cy="526" r="3"/><circle cx="469" cy="526" r="3"/><circle cx="486" cy="526" r="3"/><circle cx="503" cy="526" r="3"/><circle cx="520" cy="526" r="3"/>
    <circle cx="443" cy="719" r="3"/><circle cx="459" cy="719" r="3"/><circle cx="476" cy="719" r="3"/><circle cx="492" cy="719" r="3"/><circle cx="508" cy="719" r="3"/><circle cx="525" cy="719" r="3"/><circle cx="541" cy="719" r="3"/>
    <circle cx="443" cy="912" r="3"/><circle cx="460" cy="912" r="3"/><circle cx="477" cy="912" r="3"/><circle cx="494" cy="912" r="3"/><circle cx="512" cy="912" r="3"/><circle cx="529" cy="912" r="3"/><circle cx="546" cy="912" r="3"/><circle cx="563" cy="912" r="3"/>
  </g>

  <!-- Veggnavn og lengder -->
  <g font-size="12" fill="#5c3714" text-anchor="middle">
    <rect x="403" y="345" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="462" y="358">Vegg A · L = 4,10 m</text>
    <rect x="403" y="538" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="462" y="551">Vegg B · L = 5,00 m</text>
    <rect x="446" y="731" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="505" y="744">Vegg C · L = 4,10 m</text>
    <rect x="446" y="924" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="505" y="937">Vegg D · L = 5,00 m</text>
  </g>

  </g>

  <text x="85" y="1182" font-size="11.5" fill="#3f4a3f">Foten av skråningen – målt i veggenes akse (●), interpolert mellom målepunktene. Stiplet der den ikke er målt.</text>

  <!-- Måltabell -->
  <rect x="85" y="1200" width="620" height="186" fill="#f7f4ec" stroke="#c9bfa6" stroke-width="1"/>
  <text x="101" y="1223" font-size="13" font-weight="600" fill="#1a1a1a">Målte avstander og resulterende lengder</text>
  <g font-size="12.5" fill="#333">
    <text x="101" y="1246" font-weight="600">Vegg</text>
    <text x="155" y="1246" font-weight="600">Mellom</text>
    <text x="265" y="1246" font-weight="600">A – målt</text>
    <text x="355" y="1246" font-weight="600">L – lengde levegg</text>
    <text x="545" y="1246" font-weight="600">Stolper</text>

    <text x="101" y="1266">A</text><text x="155" y="1266">HIV 50 – 52</text><text x="265" y="1266">4,10 m</text><text x="355" y="1266">4,10 m – til skråningsfot</text><text x="545" y="1266">7 stk · c/c 0,68 m</text>
    <text x="101" y="1285">B</text><text x="155" y="1285">HIV 52 – 54</text><text x="265" y="1285">5,30 m</text><text x="355" y="1285">5,00 m – 5 m-grensen</text><text x="545" y="1285">8 stk · c/c 0,71 m</text>
    <text x="101" y="1304">C</text><text x="155" y="1304">HIV 54 – 56</text><text x="265" y="1304">4,10 m</text><text x="355" y="1304">4,10 m – til skråningsfot</text><text x="545" y="1304">7 stk · c/c 0,68 m</text>
    <text x="101" y="1323">D</text><text x="155" y="1323">HIV 56 – 58</text><text x="265" y="1323">5,00 m</text><text x="355" y="1323">5,00 m – begge sammenfaller</text><text x="545" y="1323">8 stk · c/c 0,71 m</text>
  </g>
  <text x="101" y="1348" font-size="12.5" fill="#333">Regel: L = den minste av 5,0 m og A. Hver vegg starter ved den av de to husveggene som ligger lengst øst.</text>
  <text x="101" y="1365" font-size="12.5" fill="#333">Vegg B stopper 0,30 m før skråningsfoten fordi 5 m-grensen kommer først. Alle vegger er innenfor 5,0 m.</text>
  <text x="101" y="1381" font-size="11.5" fill="#666">Alle stolper står på eget betongfundament. Rekka er tegnet med sin faktiske dreining på ca. 2°.</text>
</svg>
