<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Oppriss av levegg med staaende graa kledning foran og stolper c/c 80 cm bak">
  <title>Levegg – oppriss</title>
  <desc>Oppriss sett fra siden. Høyde 1,8 m over ferdig terreng, stående kledning i malmfuru med grå jernvitriolbehandling montert på utsiden, stolper c/c 0,80 m og vannrette sviller vist stiplet bak kledningen.</desc>

  <defs>
    <pattern id="terreng" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#a8a49b" stroke-width="1.6"/>
    </pattern>
    <pattern id="husvegg" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#b3b0a8" stroke-width="1.4"/>
    </pattern>
    <marker id="pil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="pilStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#ffffff"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Levegg – oppriss</text>
  <text x="450" y="53" text-anchor="middle" font-size="12.5" fill="#555">Stående kledning i malmfuru med grå jernvitriolbehandling, montert på utsiden. Skala 1 m = 120 px.</text>
  <text x="450" y="71" text-anchor="middle" font-size="12.5" fill="#555">Stolper og sviller ligger bak kledningen og er vist stiplet. Eksempel med L = 5,00 m.</text>

  <!-- Husvegg -->
  <rect x="96" y="130" width="54" height="290" fill="url(#husvegg)" stroke="#8e8b83" stroke-width="1.5"/>
  <text x="123" y="122" text-anchor="middle" font-size="12" fill="#6e6b64">Husvegg</text>

  <!-- Terreng -->
  <line x1="60" y1="420" x2="840" y2="420" stroke="#6e6b64" stroke-width="2.5"/>
  <rect x="60" y="420" width="780" height="26" fill="url(#terreng)"/>
  <text x="64" y="440" font-size="12" fill="#6e6b64">Ferdig terreng</text>

  <!-- Bakre bordlag (synlig gjennom spaltene ved vekselvis kledning) -->
  <rect x="150" y="214" width="600" height="182" fill="#75736d"/>
  <g stroke="#605e59" stroke-width="1">
    <line x1="165" y1="214" x2="165" y2="396"/><line x1="195" y1="214" x2="195" y2="396"/>
    <line x1="225" y1="214" x2="225" y2="396"/><line x1="255" y1="214" x2="255" y2="396"/>
    <line x1="285" y1="214" x2="285" y2="396"/><line x1="315" y1="214" x2="315" y2="396"/>
    <line x1="345" y1="214" x2="345" y2="396"/><line x1="375" y1="214" x2="375" y2="396"/>
    <line x1="405" y1="214" x2="405" y2="396"/><line x1="435" y1="214" x2="435" y2="396"/>
    <line x1="465" y1="214" x2="465" y2="396"/><line x1="495" y1="214" x2="495" y2="396"/>
    <line x1="525" y1="214" x2="525" y2="396"/><line x1="555" y1="214" x2="555" y2="396"/>
    <line x1="585" y1="214" x2="585" y2="396"/><line x1="615" y1="214" x2="615" y2="396"/>
    <line x1="645" y1="214" x2="645" y2="396"/><line x1="675" y1="214" x2="675" y2="396"/>
    <line x1="705" y1="214" x2="705" y2="396"/><line x1="735" y1="214" x2="735" y2="396"/>
  </g>

  <!-- Stående kledning på utsiden -->
  <g fill="#9e9c94" stroke="#6e6b64" stroke-width="0.9">
    <rect x="150" y="214" width="18" height="182"/><rect x="180" y="214" width="18" height="182"/>
    <rect x="210" y="214" width="18" height="182"/><rect x="240" y="214" width="18" height="182"/>
    <rect x="270" y="214" width="18" height="182"/><rect x="300" y="214" width="18" height="182"/>
    <rect x="330" y="214" width="18" height="182"/><rect x="360" y="214" width="18" height="182"/>
    <rect x="390" y="214" width="18" height="182"/><rect x="420" y="214" width="18" height="182"/>
    <rect x="450" y="214" width="18" height="182"/><rect x="480" y="214" width="18" height="182"/>
    <rect x="510" y="214" width="18" height="182"/><rect x="540" y="214" width="18" height="182"/>
    <rect x="570" y="214" width="18" height="182"/><rect x="600" y="214" width="18" height="182"/>
    <rect x="630" y="214" width="18" height="182"/><rect x="660" y="214" width="18" height="182"/>
    <rect x="690" y="214" width="18" height="182"/><rect x="720" y="214" width="18" height="182"/>
  </g>

  <!-- Dekkbord -->
  <rect x="144" y="203" width="612" height="11" fill="#8a887f" stroke="#5f5d57" stroke-width="1.4"/>
  <text x="764" y="212" font-size="11.5" fill="#5f5d57">Dekkbord</text>

  <!-- Stolper og sviller bak kledningen, vist stiplet -->
  <g stroke="#33322f" stroke-width="1.7" stroke-dasharray="9 5" fill="none">
    <rect x="144" y="204" width="12" height="216"/>
    <rect x="230" y="204" width="12" height="216"/>
    <rect x="315" y="204" width="12" height="216"/>
    <rect x="401" y="204" width="12" height="216"/>
    <rect x="487" y="204" width="12" height="216"/>
    <rect x="572" y="204" width="12" height="216"/>
    <rect x="658" y="204" width="12" height="216"/>
    <rect x="744" y="204" width="12" height="216"/>
  </g>
  <g stroke="#33322f" stroke-width="1.3" stroke-dasharray="8 5" fill="none">
    <line x1="150" y1="228" x2="750" y2="228"/>
    <line x1="150" y1="305" x2="750" y2="305"/>
    <line x1="150" y1="382" x2="750" y2="382"/>
  </g>

  <!-- Punktfundament i betong under hver stolpe -->
  <g fill="#d2d0cb" stroke="#8b8983" stroke-width="1.2">
    <rect x="138" y="420" width="24" height="40"/><rect x="224" y="420" width="24" height="40"/>
    <rect x="309" y="420" width="24" height="40"/><rect x="395" y="420" width="24" height="40"/>
    <rect x="481" y="420" width="24" height="40"/><rect x="566" y="420" width="24" height="40"/>
    <rect x="652" y="420" width="24" height="40"/><rect x="738" y="420" width="24" height="40"/>
  </g>
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#555">Punktfundament i betong med stolpesko under hver stolpe, ført til frostfri dybde</text>

  <!-- Målsetting: høyde -->
  <line x1="80" y1="203" x2="80" y2="420" stroke="#333" stroke-width="1.2" marker-start="url(#pilStart)" marker-end="url(#pil)"/>
  <line x1="72" y1="203" x2="150" y2="203" stroke="#333" stroke-width="0.7" stroke-dasharray="3 3"/>
  <line x1="72" y1="420" x2="150" y2="420" stroke="#333" stroke-width="0.7" stroke-dasharray="3 3"/>
  <text x="70" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a" transform="rotate(-90 70 312)">1,8 m</text>

  <!-- Målsetting: luftespalte -->
  <line x1="790" y1="396" x2="790" y2="420" stroke="#1f4e79" stroke-width="1.2"/>
  <line x1="784" y1="396" x2="796" y2="396" stroke="#1f4e79" stroke-width="1"/>
  <line x1="784" y1="420" x2="796" y2="420" stroke="#1f4e79" stroke-width="1"/>
  <line x1="750" y1="396" x2="790" y2="396" stroke="#1f4e79" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="800" y="412" font-size="11" fill="#1f4e79">≥ 200 mm</text>

  <!-- Målsetting: stolpeavstand -->
  <line x1="150" y1="180" x2="236" y2="180" stroke="#333" stroke-width="1.1" marker-start="url(#pilStart)" marker-end="url(#pil)"/>
  <line x1="150" y1="172" x2="150" y2="204" stroke="#333" stroke-width="0.7"/>
  <line x1="236" y1="172" x2="236" y2="204" stroke="#333" stroke-width="0.7"/>
  <text x="193" y="168" text-anchor="middle" font-size="12" fill="#1a1a1a">c/c 0,72 m</text>
  <text x="330" y="168" font-size="12" fill="#555">Stolper c/c maks 0,80 m. Alle står på eget betongfundament.</text>

  <!-- Målsetting: lengde -->
  <line x1="150" y1="516" x2="750" y2="516" stroke="#333" stroke-width="1.2" marker-start="url(#pilStart)" marker-end="url(#pil)"/>
  <line x1="150" y1="486" x2="150" y2="524" stroke="#333" stroke-width="0.7" stroke-dasharray="3 3"/>
  <line x1="750" y1="486" x2="750" y2="524" stroke="#333" stroke-width="0.7" stroke-dasharray="3 3"/>
  <text x="450" y="510" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">L = 3,10–5,00 m, se planskisse</text>

  <!-- Tegnforklaring -->
  <rect x="60" y="540" width="780" height="102" fill="#f4f3f0" stroke="#c6c3bc" stroke-width="1"/>
  <g font-size="12.5" fill="#333">
    <rect x="76" y="552" width="26" height="12" fill="#9e9c94" stroke="#6e6b64" stroke-width="0.9"/>
    <text x="112" y="562">Stående kledning på utsiden – malmfuru med grå jernvitriolbehandling, samme profil som husets kledning</text>
    <rect x="76" y="572" width="26" height="12" fill="#75736d"/>
    <text x="112" y="582">Bakre bordlag, synlig gjennom spaltene ved vekselvis kledning – se eget snitt</text>
    <rect x="76" y="592" width="26" height="12" fill="none" stroke="#33322f" stroke-width="1.7" stroke-dasharray="9 5"/>
    <text x="112" y="602">Stolper c/c maks 0,80 m og vannrette sviller – ligger bak kledningen, vist stiplet</text>
    <rect x="76" y="612" width="26" height="12" fill="#d2d0cb" stroke="#8b8983" stroke-width="1.2"/>
    <text x="112" y="622">Betongfundament med stolpesko under hver stolpe, ført til frostfri dybde</text>
  </g>
  <text x="76" y="640" font-size="11.5" fill="#666">Høyden 1,8 m måles fra ferdig terreng. Innfesting med A4 syrefaste skruer.</text>
</svg>
