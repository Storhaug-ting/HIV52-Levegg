<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1650" width="820" height="1650" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Planskisse alternativ 1 med forskjovne hus og maalte lengder for de fire leveggene">
  <title>Levegger rekka HIV 50–58 – planskisse alternativ 1</title>
  <desc>Plan med nord opp. Husene er plassert med sin observerte innbyrdes forskyvning, og rekka er dreid ca. 2° i forhold til nord. Hver levegg føres til foten av skråningen, begrenset til 5,0 m.</desc>

  <defs>
    <pattern id="skraaning" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9aa89a" stroke-width="2"/>
    </pattern>
    <pattern id="bakke" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bec496" stroke-width="2"/>
    </pattern>
    <marker id="pil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="820" height="1400" fill="#ffffff"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Alternativ 1 – levegg til foten av skråningen, maks 5,0 m</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#555">Plan, rekka Helge Ingstads vei 50–58 (hus B, seksjon 6–10), Griniskogen Vest. Nord opp.</text>
  <text x="410" y="72" text-anchor="middle" font-size="12.5" fill="#555">Rekka er dreid ca. 2° i forhold til nord. Skala 1 m = 20 px.</text>
  <text x="410" y="94" text-anchor="middle" font-size="11.5" fill="#555">Skråning ca. 3,0 m bred; hekkestammer ca. 0,5 m inn (ca. 45 pr. hus); neste bakke ca. 2,0 m; åker øst for denne.</text>

  <!-- Nordpil -->
  <g stroke="#444" fill="#444">
    <line x1="770" y1="180" x2="770" y2="118" stroke-width="2" marker-end="url(#pil)"/>
    <text x="770" y="204" text-anchor="middle" font-size="14" font-weight="600" stroke="none">N</text>
  </g>

  <g transform="rotate(2 372 740)">

  <!-- Uteoppholdsareal -->
  <path d="M294,140 L428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L426,1340 L426,860 L370,860 L370,380 L294,380 Z"
        fill="#f2f7ee" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Åker, neste bakke og 3 m bred skråning -->
  <path d="M538,140 L562,380 L586,620 L618,860 L636,1100 L654,1340 L750,1340 L750,140 Z" fill="#ead77a" stroke="#c6ad4c" stroke-width="1"/>
  <path d="M498,140 L522,380 L546,620 L578,860 L596,1100 L614,1340 L654,1340 L636,1100 L618,860 L586,620 L562,380 L538,140 Z" fill="url(#bakke)" stroke="#aeb78b" stroke-width="1"/>
  <path d="M428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L604,1340 L586,1100 L568,860 L536,620 L512,380 L488,140 Z" fill="url(#skraaning)" stroke="#8b9a8b" stroke-width="1"/>
  <polyline points="452,380 476,620 508,860 526,1100" fill="none" stroke="#5c6b5c" stroke-width="3"/>
  <polyline points="428,140 452,380" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="526,1100 544,1340" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#5c6b5c">
    <circle cx="452" cy="380" r="4"/><circle cx="476" cy="620" r="4"/><circle cx="508" cy="860" r="4"/><circle cx="526" cy="1100" r="4"/>
  </g>
  <g fill="none" stroke="#b7dba4" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 4.333">
    <line x1="438" y1="140" x2="462" y2="380"/><line x1="462" y1="380" x2="486" y2="620"/>
    <line x1="486" y1="620" x2="518" y2="860"/><line x1="518" y1="860" x2="536" y2="1100"/>
    <line x1="536" y1="1100" x2="554" y2="1340"/>
  </g>
  <text x="540" y="740" font-size="12" fill="#3f4a3f" transform="rotate(90 540 740)" text-anchor="middle">Skråning ca. 3,0 m</text>
  <text x="592" y="740" font-size="12" fill="#667044" transform="rotate(90 592 740)" text-anchor="middle">Neste bakke ca. 2,0 m</text>
  <text x="700" y="740" font-size="13" fill="#826f23" transform="rotate(90 700 740)" text-anchor="middle">Åker</text>

  <text x="82" y="740" font-size="11" fill="#6b6250" transform="rotate(-90 82 740)" text-anchor="middle">Vestside – adkomst og carport</text>

  <!-- Standardplatting på sørsiden av hvert hus -->
  <g fill="#f3e6a5" stroke="#b5a764" stroke-width="1.2">
    <rect x="294" y="297" width="60" height="83"/>
    <rect x="370" y="537" width="60" height="83"/>
    <rect x="370" y="777" width="60" height="83"/>
    <rect x="426" y="1017" width="60" height="83"/>
    <rect x="426" y="1257" width="60" height="83"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#6f6121">
    <text x="324" y="342">Platting</text>
    <text x="400" y="578">Platting</text>
    <text x="400" y="822">Platting</text>
    <text x="456" y="1062">Platting</text>
    <text x="456" y="1302">Platting</text>
  </g>
  <!-- Levegger -->
  <g stroke="#7a4a1e" stroke-width="9" stroke-linecap="butt">
    <line x1="370" y1="386" x2="452" y2="386"/>
    <line x1="370" y1="626" x2="470" y2="626"/>
    <line x1="426" y1="866" x2="508" y2="866"/>
    <line x1="426" y1="1106" x2="526" y2="1106"/>
  </g>

  <!-- Stolper c/c maks 0,80 m -->
  <g fill="#5c3714">
    <circle cx="370" cy="386" r="3"/><circle cx="384" cy="386" r="3"/><circle cx="397" cy="386" r="3"/><circle cx="411" cy="386" r="3"/><circle cx="425" cy="386" r="3"/><circle cx="438" cy="386" r="3"/><circle cx="452" cy="386" r="3"/>
    <circle cx="370" cy="626" r="3"/><circle cx="384" cy="626" r="3"/><circle cx="399" cy="626" r="3"/><circle cx="413" cy="626" r="3"/><circle cx="427" cy="626" r="3"/><circle cx="441" cy="626" r="3"/><circle cx="456" cy="626" r="3"/><circle cx="470" cy="626" r="3"/>
    <circle cx="426" cy="866" r="3"/><circle cx="440" cy="866" r="3"/><circle cx="453" cy="866" r="3"/><circle cx="467" cy="866" r="3"/><circle cx="481" cy="866" r="3"/><circle cx="494" cy="866" r="3"/><circle cx="508" cy="866" r="3"/>
    <circle cx="426" cy="1106" r="3"/><circle cx="440" cy="1106" r="3"/><circle cx="455" cy="1106" r="3"/><circle cx="469" cy="1106" r="3"/><circle cx="483" cy="1106" r="3"/><circle cx="497" cy="1106" r="3"/><circle cx="512" cy="1106" r="3"/><circle cx="526" cy="1106" r="3"/>
  </g>

  <!-- Husflater ligger over leveggene, slik at stolper stopper ved fasadelivet -->
  <g fill="#e8e2d6" stroke="#8a7f6a" stroke-width="2">
    <rect x="100" y="140" width="194" height="240"/>
    <rect x="176" y="380" width="194" height="240"/>
    <rect x="176" y="620" width="194" height="240"/>
    <rect x="232" y="860" width="194" height="240"/>
    <rect x="232" y="1100" width="194" height="240"/>
  </g>
  <g text-anchor="middle" fill="#4a4232">
    <text x="197" y="250" font-size="16">HIV 50</text><text x="197" y="270" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 6</text>
    <text x="273" y="490" font-size="16">HIV 52</text><text x="273" y="510" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 7</text>
    <text x="273" y="730" font-size="16">HIV 54</text><text x="273" y="750" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 8</text>
    <text x="329" y="970" font-size="16">HIV 56</text><text x="329" y="990" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 9</text>
    <text x="329" y="1210" font-size="16">HIV 58</text><text x="329" y="1230" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 10</text>
  </g>

  <!-- Veggnavn og lengder -->
  <g font-size="12" fill="#5c3714" text-anchor="middle">
    <rect x="352" y="398" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="411" y="411">Vegg A · L = 4,10 m</text>
    <rect x="361" y="638" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="420" y="651">Vegg B · L = 5,00 m</text>
    <rect x="408" y="878" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="467" y="891">Vegg C · L = 4,10 m</text>
    <rect x="417" y="1118" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="476" y="1131">Vegg D · L = 5,00 m</text>
  </g>

  </g>

  <text x="85" y="1418" font-size="11.5" fill="#3f4a3f">Foten av skråningen – målt i veggenes akse (●), interpolert mellom målepunktene. Stiplet der den ikke er målt.</text>

  <!-- Måltabell -->
  <rect x="85" y="1435" width="620" height="186" fill="#f7f4ec" stroke="#c9bfa6" stroke-width="1"/>
  <text x="101" y="1458" font-size="13" font-weight="600" fill="#1a1a1a">Målte avstander og resulterende lengder</text>
  <g font-size="12.5" fill="#333">
    <text x="101" y="1481" font-weight="600">Vegg</text>
    <text x="155" y="1481" font-weight="600">Mellom</text>
    <text x="265" y="1481" font-weight="600">A – målt</text>
    <text x="355" y="1481" font-weight="600">L – lengde levegg</text>
    <text x="545" y="1481" font-weight="600">Stolper</text>

    <text x="101" y="1501">A</text><text x="155" y="1501">HIV 50 – 52</text><text x="265" y="1501">4,10 m</text><text x="355" y="1501">4,10 m – til skråningsfot</text><text x="545" y="1501">7 stk · c/c 0,68 m</text>
    <text x="101" y="1520">B</text><text x="155" y="1520">HIV 52 – 54</text><text x="265" y="1520">5,30 m</text><text x="355" y="1520">5,00 m – 5 m-grensen</text><text x="545" y="1520">8 stk · c/c 0,71 m</text>
    <text x="101" y="1539">C</text><text x="155" y="1539">HIV 54 – 56</text><text x="265" y="1539">4,10 m</text><text x="355" y="1539">4,10 m – til skråningsfot</text><text x="545" y="1539">7 stk · c/c 0,68 m</text>
    <text x="101" y="1558">D</text><text x="155" y="1558">HIV 56 – 58</text><text x="265" y="1558">5,00 m</text><text x="355" y="1558">5,00 m – begge sammenfaller</text><text x="545" y="1558">8 stk · c/c 0,71 m</text>
  </g>
  <text x="101" y="1583" font-size="12.5" fill="#333">Regel: L = den minste av 5,0 m og A. Hver vegg starter ved den av de to husveggene som ligger lengst øst.</text>
  <text x="101" y="1600" font-size="12.5" fill="#333">Vegg B stopper 0,30 m før skråningsfoten fordi 5 m-grensen kommer først. Alle vegger er innenfor 5,0 m.</text>
  <text x="101" y="1616" font-size="11.5" fill="#666">Alle stolper står på eget betongfundament. Rekka er tegnet med sin faktiske dreining på ca. 2°.</text>
</svg>
