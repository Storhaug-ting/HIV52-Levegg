name: Planoppgave
description: Opprett en oppgave som skal vises i planen på nettstedet.
title: ''
labels: ['plan']
body:
  - type: textarea
    id: beskrivelse
    attributes:
      label: Beskrivelse
      description: Beskriv hva som må gjøres og eventuelle avhengigheter.
    validations:
      required: true
  - type: input
    id: planrekkefolge
    attributes:
      label: Planrekkefølge
      description: Skriv trinnets plass i planen, for eksempel 1.
      placeholder: '1'
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Ikke startet
        - Pågår
        - Avventer
        - Blokkert
    validations:
      required: true
  - type: input
    id: planlagt-dato
    attributes:
      label: Planlagt dato
      description: Skriv datoen som YYYY-MM-DD.
      placeholder: '2026-09-01'
    validations:
      required: true
