  <title
     id="title1">Levegger rekka HIV 50–58 – planskisse alternativ 1</title>
  <desc
     id="desc1">Plan med nord opp. Husene er plassert med sin observerte innbyrdes forskyvning, og rekka er dreid ca. 2° i forhold til nord. Hver levegg føres til foten av skråningen, begrenset til 5,0 m.</desc>
