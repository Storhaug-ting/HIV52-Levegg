<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1650" width="210mm" height="297mm" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Måleplan uten levegger for rekka HIV 50 til 58">
  <title>Måleplan – avstander fra hus til skråningsfot</title>
  <desc>Plan uten foreslåtte levegger. Stiplede målelinjer viser de oppmålte avstandene fra yttervegg til skråningsfot for fire plasseringer mellom HIV 50 og HIV 58.</desc>

  <defs>
    <pattern id="skraaning" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9aa89a" stroke-width="2"/>
    </pattern>
    <pattern id="bakke" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#bec496" stroke-width="2"/>
    </pattern>
    <marker id="pil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="pilBla" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/>
    </marker>
    <marker id="pilBlaStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <rect width="820" height="1650" fill="#ffffff"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Måleplan – avstander fra yttervegg til skråningsfot</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#555">Rekka Helge Ingstads vei 50–58 (hus B, seksjon 6–10), Griniskogen Vest. Nord opp.</text>
  <text x="410" y="72" text-anchor="middle" font-size="12.5" fill="#555">Uten foreslåtte levegger. Skala 1 m = 20 px. Rekka er dreid ca. 2° i forhold til nord.</text>
  <text x="410" y="94" text-anchor="middle" font-size="11.5" fill="#555">Skråning ca. 3,0 m bred; hekkestammer ca. 0,5 m inn (ca. 45 pr. hus); neste bakke ca. 2,0 m; åker øst for denne.</text>

  <g stroke="#444" fill="#444">
    <line x1="770" y1="180" x2="770" y2="118" stroke-width="2" marker-end="url(#pil)"/>
    <text x="770" y="204" text-anchor="middle" font-size="14" font-weight="600" stroke="none">N</text>
  </g>

  <g transform="rotate(2 372 740)">
    <path d="M294,140 L428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L426,1340 L426,860 L370,860 L370,380 L294,380 Z"
          fill="#f2f7ee" stroke="#c8d4c0" stroke-width="1"/>

    <!-- Åker, neste bakke og skråning fra grønn linje -->
    <path d="M538,140 L562,380 L586,620 L618,860 L636,1100 L654,1340 L750,1340 L750,140 Z" fill="#ead77a" stroke="#c6ad4c" stroke-width="1"/>
    <path d="M498,140 L522,380 L546,620 L578,860 L596,1100 L614,1340 L654,1340 L636,1100 L618,860 L586,620 L562,380 L538,140 Z" fill="url(#bakke)" stroke="#aeb78b" stroke-width="1"/>
    <path d="M428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L604,1340 L586,1100 L568,860 L536,620 L512,380 L488,140 Z" fill="url(#skraaning)" stroke="#8b9a8b" stroke-width="1"/>
    <polyline points="452,380 476,620 508,860 526,1100" fill="none" stroke="#5c6b5c" stroke-width="3"/>
    <polyline points="428,140 452,380" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
    <polyline points="526,1100 544,1340" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
    <g fill="#5c6b5c">
      <circle cx="452" cy="380" r="4"/><circle cx="476" cy="620" r="4"/><circle cx="508" cy="860" r="4"/><circle cx="526" cy="1100" r="4"/>
    </g>
    <g fill="none" stroke="#b7dba4" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 4.333">
      <line x1="438" y1="140" x2="462" y2="380"/><line x1="462" y1="380" x2="486" y2="620"/>
      <line x1="486" y1="620" x2="518" y2="860"/><line x1="518" y1="860" x2="536" y2="1100"/>
      <line x1="536" y1="1100" x2="554" y2="1340"/>
    </g>
    <text x="540" y="740" font-size="12" fill="#3f4a3f" transform="rotate(90 540 740)" text-anchor="middle">Skråning ca. 3,0 m</text>
    <text x="592" y="740" font-size="12" fill="#667044" transform="rotate(90 592 740)" text-anchor="middle">Neste bakke ca. 2,0 m</text>
    <text x="700" y="740" font-size="13" fill="#826f23" transform="rotate(90 700 740)" text-anchor="middle">Åker</text>

    <!-- Stiplede mål til skråningsfoten -->
    <g stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="6 4" fill="none">
      <line x1="370" y1="386" x2="452" y2="386" marker-start="url(#pilBlaStart)" marker-end="url(#pilBla)"/>
      <line x1="370" y1="626" x2="476" y2="626" marker-start="url(#pilBlaStart)" marker-end="url(#pilBla)"/>
      <line x1="426" y1="866" x2="508" y2="866" marker-start="url(#pilBlaStart)" marker-end="url(#pilBla)"/>
      <line x1="426" y1="1106" x2="526" y2="1106" marker-start="url(#pilBlaStart)" marker-end="url(#pilBla)"/>
    </g>

    <!-- Husflater dekker starten på målelinjene, mens tekst kommer øverst -->
    <g fill="#e8e2d6" stroke="#8a7f6a" stroke-width="2">
      <rect x="100" y="140" width="194" height="240"/>
      <rect x="176" y="380" width="194" height="240"/>
      <rect x="176" y="620" width="194" height="240"/>
      <rect x="232" y="860" width="194" height="240"/>
      <rect x="232" y="1100" width="194" height="240"/>
    </g>
    <text x="82" y="740" font-size="11" fill="#6b6250" transform="rotate(-90 82 740)" text-anchor="middle">Vestside – adkomst og carport</text>

    <g fill="#f3e6a5" stroke="#b5a764" stroke-width="1.2">
      <rect x="294" y="297" width="60" height="83"/>
      <rect x="370" y="537" width="60" height="83"/>
      <rect x="370" y="777" width="60" height="83"/>
      <rect x="426" y="1017" width="60" height="83"/>
      <rect x="426" y="1257" width="60" height="83"/>
    </g>

    <g text-anchor="middle" fill="#4a4232">
      <text x="197" y="250" font-size="16">HIV 50</text><text x="197" y="270" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 6</text>
      <text x="273" y="490" font-size="16">HIV 52</text><text x="273" y="510" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 7</text>
      <text x="273" y="730" font-size="16">HIV 54</text><text x="273" y="750" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 8</text>
      <text x="329" y="970" font-size="16">HIV 56</text><text x="329" y="990" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 9</text>
      <text x="329" y="1210" font-size="16">HIV 58</text><text x="329" y="1230" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 10</text>
    </g>
    <g text-anchor="middle" font-size="10.5" fill="#6f6121">
      <text x="324" y="342">Platting</text><text x="400" y="578">Platting</text><text x="400" y="822">Platting</text>
      <text x="456" y="1062">Platting</text><text x="456" y="1302">Platting</text>
    </g>

    <g font-size="12" fill="#1f4e79" text-anchor="middle">
      <rect x="352" y="398" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="411" y="411">A · 4,10 m</text>
      <rect x="364" y="638" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="423" y="651">B · 5,30 m</text>
      <rect x="408" y="878" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="467" y="891">C · 4,10 m</text>
      <rect x="417" y="1118" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="476" y="1131">D · 5,00 m</text>
    </g>
  </g>

  <text x="85" y="1418" font-size="11.5" fill="#3f4a3f">Stiplede blå målelinjer går fra husenes yttervegg til grønn linje, som viser foten av skråningen.</text>

  <rect x="85" y="1435" width="620" height="166" fill="#f7f4ec" stroke="#c9bfa6" stroke-width="1"/>
  <text x="101" y="1458" font-size="13" font-weight="600" fill="#1a1a1a">Målte avstander</text>
  <g font-size="12.5" fill="#333">
    <text x="101" y="1481" font-weight="600">Vegg</text><text x="155" y="1481" font-weight="600">Mellom</text><text x="265" y="1481" font-weight="600">A – målt</text><text x="355" y="1481" font-weight="600">Målt fra / til</text>
    <text x="101" y="1501">A</text><text x="155" y="1501">HIV 50 – 52</text><text x="265" y="1501">4,10 m</text><text x="355" y="1501">Yttervegg – skråningsfot</text>
    <text x="101" y="1520">B</text><text x="155" y="1520">HIV 52 – 54</text><text x="265" y="1520">5,30 m</text><text x="355" y="1520">Yttervegg – skråningsfot</text>
    <text x="101" y="1539">C</text><text x="155" y="1539">HIV 54 – 56</text><text x="265" y="1539">4,10 m</text><text x="355" y="1539">Yttervegg – skråningsfot</text>
    <text x="101" y="1558">D</text><text x="155" y="1558">HIV 56 – 58</text><text x="265" y="1558">5,00 m</text><text x="355" y="1558">Yttervegg – skråningsfot</text>
  </g>
  <text x="101" y="1583" font-size="11.5" fill="#666">Målingene er grunnlaget for lengdeavgrensning i planalternativene med levegger.</text>
</svg>
