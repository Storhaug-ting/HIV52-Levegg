<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507.6192 1244.4432" width="130mm" height="224mm" preserveAspectRatio="xMidYMid" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Planskisse alternativ 2 med forskjovne hus og gjennomgaaende passasje langs skraningsfoten">
  <title>Levegger rekka HIV 50–58 – planskisse alternativ 2</title>
  <desc>Plan med nord opp. Husene er plassert med sin observerte innbyrdes forskyvning, og rekka er dreid ca. 2° i forhold til nord. Hver levegg stopper 1,0 m før foten av skråningen, slik at det blir en gjennomgående passasje langs skråningsfoten for hele rekka.</desc>

  <defs>
    <pattern id="skraaning" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9aa89a" stroke-width="2"/>
    </pattern>
    <marker id="pil" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
    <marker id="pilBla" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/>
    </marker>
    <marker id="pilBlaStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#1f4e79"/>
    </marker>
  </defs>

  <rect width="507.6192" height="1244.4432" fill="#ffffff"/>

  <g transform="rotate(0.11505739,59725.396,-77451.288)">

  <!-- Uteoppholdsareal -->
  <path d="M294,140 L428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L426,1340 L426,860 L370,860 L370,380 L294,380 Z"
        fill="#f2f7ee" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Gjennomgående passasje, 1,0 m innenfor skråningsfoten -->
  <path d="M408,140 L432,380 L456,620 L488,860 L506,1100 L524,1340 L544,1340 L526,1100 L508,860 L476,620 L452,380 L428,140 Z"
      fill="#cfe4f7" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="7 4"/>

  <!-- Åker og 3 m bred skråning -->
  <path d="M488,140 L512,380 L536,620 L568,860 L586,1100 L604,1340 L750,1340 L750,140 Z" fill="#ead77a" stroke="#c6ad4c" stroke-width="1"/>
  <path d="M428,140 L452,380 L476,620 L508,860 L526,1100 L544,1340 L604,1340 L586,1100 L568,860 L536,620 L512,380 L488,140 Z" fill="url(#skraaning)" stroke="#8b9a8b" stroke-width="1"/>
  <polyline points="452,380 476,620 508,860 526,1100" fill="none" stroke="#5c6b5c" stroke-width="3"/>
  <polyline points="428,140 452,380" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <polyline points="526,1100 544,1340" fill="none" stroke="#5c6b5c" stroke-width="2" stroke-dasharray="7 5"/>
  <g fill="#5c6b5c">
    <circle cx="452" cy="380" r="4"/><circle cx="476" cy="620" r="4"/><circle cx="508" cy="860" r="4"/><circle cx="526" cy="1100" r="4"/>
  </g>
  <g fill="none" stroke="#b7dba4" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 4.333">
    <line x1="438" y1="140" x2="462" y2="380"/><line x1="462" y1="380" x2="486" y2="620"/>
    <line x1="486" y1="620" x2="518" y2="860"/><line x1="518" y1="860" x2="536" y2="1100"/>
    <line x1="536" y1="1100" x2="554" y2="1340"/>
  </g>
  <text x="540" y="740" font-size="12" fill="#3f4a3f" transform="rotate(90 540 740)" text-anchor="middle">Skråning</text>
  <text x="700" y="740" font-size="13" fill="#826f23" transform="rotate(90 700 740)" text-anchor="middle">Åker</text>

  <text x="82" y="740" font-size="11" fill="#6b6250" transform="rotate(-90 82 740)" text-anchor="middle">Vestside – adkomst og carport</text>

  <!-- Standardplatting på sørsiden av hvert hus -->
  <g fill="#f3e6a5" stroke="#b5a764" stroke-width="1.2">
    <rect x="294" y="297" width="60" height="83"/>
    <rect x="370" y="537" width="60" height="83"/>
    <rect x="370" y="777" width="60" height="83"/>
    <rect x="426" y="1017" width="60" height="83"/>
    <rect x="426" y="1257" width="60" height="83"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#6f6121">
    <text x="324" y="342">Platting</text>
    <text x="400" y="578">Platting</text>
    <text x="400" y="822">Platting</text>
    <text x="456" y="1062">Platting</text>
    <text x="456" y="1302">Platting</text>
  </g>
  <!-- Levegger -->
  <g stroke="#7a4a1e" stroke-width="9" stroke-linecap="butt">
    <line x1="370" y1="386" x2="432" y2="386"/>
    <line x1="370" y1="626" x2="456" y2="626"/>
    <line x1="426" y1="866" x2="488" y2="866"/>
    <line x1="426" y1="1106" x2="506" y2="1106"/>
  </g>

  <!-- Stolper c/c maks 0,80 m -->
  <g fill="#5c3714">
    <circle cx="370" cy="386" r="3"/><circle cx="386" cy="386" r="3"/><circle cx="401" cy="386" r="3"/><circle cx="417" cy="386" r="3"/><circle cx="432" cy="386" r="3"/>
    <circle cx="370" cy="626" r="3"/><circle cx="384" cy="626" r="3"/><circle cx="399" cy="626" r="3"/><circle cx="413" cy="626" r="3"/><circle cx="427" cy="626" r="3"/><circle cx="442" cy="626" r="3"/><circle cx="456" cy="626" r="3"/>
    <circle cx="426" cy="866" r="3"/><circle cx="442" cy="866" r="3"/><circle cx="457" cy="866" r="3"/><circle cx="473" cy="866" r="3"/><circle cx="488" cy="866" r="3"/>
    <circle cx="426" cy="1106" r="3"/><circle cx="442" cy="1106" r="3"/><circle cx="458" cy="1106" r="3"/><circle cx="474" cy="1106" r="3"/><circle cx="490" cy="1106" r="3"/><circle cx="506" cy="1106" r="3"/>
  </g>

  <!-- Husflater ligger over leveggene, slik at stolper stopper ved fasadelivet -->
  <g fill="#e8e2d6" stroke="#8a7f6a" stroke-width="2">
    <rect x="100" y="140" width="194" height="240"/>
    <rect x="176" y="380" width="194" height="240"/>
    <rect x="176" y="620" width="194" height="240"/>
    <rect x="232" y="860" width="194" height="240"/>
    <rect x="232" y="1100" width="194" height="240"/>
  </g>
  <g text-anchor="middle" fill="#4a4232">
    <text x="197" y="250" font-size="16">HIV 50</text><text x="197" y="270" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 6</text>
    <text x="273" y="490" font-size="16">HIV 52</text><text x="273" y="510" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 7</text>
    <text x="273" y="730" font-size="16">HIV 54</text><text x="273" y="750" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 8</text>
    <text x="329" y="970" font-size="16">HIV 56</text><text x="329" y="990" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 9</text>
    <text x="329" y="1210" font-size="16">HIV 58</text><text x="329" y="1230" font-size="10.5" fill="#6b6250">gnr. 411 / bnr. 93 / snr. 10</text>
  </g>

  <!-- Veggnavn og lengder -->
  <g font-size="12" fill="#5c3714" text-anchor="middle">
    <rect x="342" y="398" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="401" y="411">Vegg A · L = 3,10 m</text>
    <rect x="354" y="638" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="413" y="651">Vegg B · L = 4,30 m</text>
    <rect x="398" y="878" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="457" y="891">Vegg C · L = 3,10 m</text>
    <rect x="407" y="1118" width="118" height="18" fill="#ffffff" opacity="0.92"/><text x="466" y="1131">Vegg D · L = 4,00 m</text>
  </g>

  <!-- 1,0 m bred ferdselsåre mellom levegg og skråningsfot -->
  <line x1="472" y1="740" x2="492" y2="740" stroke="#1f4e79" stroke-width="1.4" marker-start="url(#pilBlaStart)" marker-end="url(#pilBla)"/>
  <line x1="472" y1="732" x2="472" y2="748" stroke="#1f4e79" stroke-width="0.9"/>
  <line x1="492" y1="732" x2="492" y2="748" stroke="#1f4e79" stroke-width="0.9"/>
  <text x="522" y="1220" font-size="12" font-weight="600" fill="#1f4e79" text-anchor="middle" transform="rotate(84 522 1220)">Ferdselsåre 1,0 m bred</text>

  </g>

  <!-- Nordpil -->
  <g stroke="#444" fill="#444">
    <line x1="474" y1="126" x2="471.84" y2="64" stroke-width="2" marker-end="url(#pil)"/>
    <text x="474" y="150" text-anchor="middle" font-size="14" font-weight="600" stroke="none">N</text>
  </g>

</svg>
